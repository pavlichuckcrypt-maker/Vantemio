[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vantemio-sound-matrix"
version = "0.1.0.dev0"
description = "Experimental validated sound planning and exact PCM cropping"
requires-python = ">=3.10"
[project.scripts]
vantemio-sound = "vantemio_sound_matrix.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
